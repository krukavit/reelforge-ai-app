<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReelForge AI - Your Reels</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0f;color:#fff;min-height:100vh;padding:24px}
.container{max-width:800px;margin:0 auto}
.logo{font-size:24px;font-weight:800;background:linear-gradient(135deg,#ff6b6b,#feca57);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.tagline{color:rgba(255,255,255,.4);font-size:14px;margin-bottom:40px}
.status{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:32px;text-align:center;margin-bottom:32px}
.status.processing .spinner{width:48px;height:48px;border:3px solid rgba(255,255,255,.1);border-top-color:#ff6b6b;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.status h2{font-size:22px;font-weight:700;margin-bottom:8px}
.status p{color:rgba(255,255,255,.5);font-size:15px}
.reels-grid{display:grid;gap:24px}
.reel-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:24px}
.reel-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.reel-number{width:40px;height:40px;background:linear-gradient(135deg,#ff6b6b,#feca57);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#0a0a0f;font-size:16px}
.reel-info h3{font-size:16px;font-weight:600;margin-bottom:4px}
.reel-info p{font-size:13px;color:rgba(255,255,255,.4)}
.hook{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.2);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:15px}
.hook-label{font-size:11px;font-weight:700;color:#ff6b6b;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.transcript{color:rgba(255,255,255,.5);font-size:14px;line-height:1.6;margin-bottom:16px;max-height:80px;overflow:hidden}
.actions{display:flex;gap:12px}
.btn{flex:1;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;transition:all .2s}
.btn-download{background:linear-gradient(135deg,#ff6b6b,#feca57);color:#0a0a0f}
.btn-download:hover{transform:translateY(-1px)}
.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:12px;padding:20px;color:#ef4444;text-align:center}
.error h3{margin-bottom:8px}
.back-btn{display:inline-block;margin-top:32px;color:rgba(255,255,255,.5);text-decoration:none;font-size:14px}
.back-btn:hover{color:#fff}
.success-badge{display:inline-block;background:rgba(74,222,128,.15);color:#4ade80;padding:6px 16px;border-radius:50px;font-size:13px;font-weight:600;margin-bottom:16px}
</style>
</head>
<body>
<div class="container">
<div class="logo">ReelForge AI</div>
<div class="tagline">Your ready Reels</div>
<div class="status processing" id="statusProcessing">
<div class="spinner"></div>
<h2>AI is processing video...</h2>
<p>This will take 1-3 minutes. We are analyzing the best moments, generating subtitles and creating hooks.</p>
</div>
<div class="status" id="statusCompleted" style="display:none">
<div class="success-badge">Done!</div>
<h2>Your Reels are ready</h2>
<p>Download them and upload to Instagram, TikTok or YouTube Shorts</p>
</div>
<div class="error" id="statusError" style="display:none">
<h3>Error</h3>
<p id="errorText"></p>
</div>
<div class="reels-grid" id="reelsGrid"></div>
<a href="/" class="back-btn">Process another video</a>
</div>
<script>
const jobId=window.location.pathname.split('/').pop();
const statusProcessing=document.getElementById('statusProcessing');
const statusCompleted=document.getElementById('statusCompleted');
const statusError=document.getElementById('statusError');
const errorText=document.getElementById('errorText');
const reelsGrid=document.getElementById('reelsGrid');
async function checkStatus(){try{const res=await fetch('/api/status/'+jobId);const data=await res.json();if(data.status==='completed'){statusProcessing.style.display='none';statusCompleted.style.display='block';renderReels(data.reels)}else if(data.status==='failed'){statusProcessing.style.display='none';statusError.style.display='block';errorText.textContent=data.error||'Unknown error'}else{setTimeout(checkStatus,3000)}}catch(err){statusProcessing.style.display='none';statusError.style.display='block';errorText.textContent='Connection error'}}
function renderReels(reels){reelsGrid.innerHTML=reels.map((reel,i)=>'<div class="reel-card"><div class="reel-header"><div class="reel-number">'+(i+1)+'</div><div class="reel-info"><h3>Reel #'+(i+1)+'</h3><p>'+formatTime(reel.start)+' - '+formatTime(reel.end)+'</p></div></div>'+(reel.hook?'<div class="hook"><div class="hook-label">Hook for Reels</div>'+reel.hook+'</div>':'')+'<div class="transcript">'+(reel.text||'Transcription unavailable')+'</div><div class="actions"><a href="'+reel.download_url+'" class="btn btn-download" download>Download Reel</a></div></div>').join('')}
function formatTime(seconds){const m=Math.floor(seconds/60);const s=Math.floor(seconds%60);return m+':'+s.toString().padStart(2,'0')}
checkStatus();
</script>
</body>
</html>
