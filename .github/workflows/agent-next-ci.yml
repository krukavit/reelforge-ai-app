name: Agent Next CI

on:
  push:
    branches:
      - agent-next-ci
    paths:
      - "agent-next/**"
      - ".github/workflows/agent-next-ci.yml"
  pull_request:
    branches:
      - master
    paths:
      - "agent-next/**"
      - ".github/workflows/agent-next-ci.yml"

permissions:
  contents: read

concurrency:
  group: agent-next-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Agent Next offline verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: agent-next

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: agent-next/requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run local verification
        env:
          PRODUCTION_MUTATION: NONE
          AGENT_NEXT_LIVE: "0"
        run: bash verify.sh
